# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

# Reusable: lints the calling repository's workflows and actions with
# actionlint and zizmor. Both read their config from the caller's checkout:
# `.github/actionlint.yaml` and `.github/zizmor.yml`. The job needs
# `contents: read`.

name: Lint workflows

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          # `latest` is the newest zizmor this action release ships a hash-pinned
          # lock for, so zizmor moves with the action's SHA pin. An exact version
          # newer than the action's locks fails with "Unknown version".
          version: latest
