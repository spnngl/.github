# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

# Reusable: validates the Renovate configuration of the calling repository
# with a pinned Renovate release. The job needs `contents: read`.

name: Renovate

on:
  workflow_call:
    inputs:
      config-files:
        description: >-
          Space-separated Renovate config files or shared presets to validate. Empty (default): the validator discovers the repository config.
        type: string
        default: ""

permissions: {}

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: ghcr.io/renovatebot/renovate:44.182.2@sha256:a3bb448e88ac8517754beccbde3a5621e41eced3f3e4e61c1f6db0ced2affb37
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # File arguments are validated as *global* config unless --no-global is
      # given, hence the flag only when files are passed.
      - name: renovate-config-validator --strict
        env:
          CONFIG_FILES: ${{ inputs.config-files }}
        run: |-
          # Word splitting of CONFIG_FILES is intended.
          # shellcheck disable=SC2086
          renovate-config-validator --strict ${CONFIG_FILES:+--no-global $CONFIG_FILES}
