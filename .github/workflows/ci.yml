# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

# Checks of this repository. The shared workflows are called through local
# paths, so a pull request runs its own version of them. Not the actions
# (setup-betterleaks, scan-image): the workflows call them at `@main`.

name: CI

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint-workflows.yml

  conventional-commits:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/conventional-commits.yml

  betterleaks:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/betterleaks.yml

  # No package here: tests the workflow's wiring only.
  image-scan:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/image-scan.yml

  renovate:
    permissions:
      contents: read
    uses: ./.github/workflows/renovate.yml
    with:
      config-files: renovate.json5 renovate.default.json5
