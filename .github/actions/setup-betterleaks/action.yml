# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json

# Installs the betterleaks release pinned below to /usr/local/bin, after
# checking it against the release's checksums. Linux x64 runners only.

name: Setup betterleaks
description: Install a checksum-verified betterleaks release.

runs:
  using: composite
  steps:
    - name: Install betterleaks
      shell: bash
      env:
        # renovate: datasource=github-releases depName=betterleaks/betterleaks
        BETTERLEAKS_VERSION: "1.9.0"
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
        tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL --proto '=https' --proto-redir '=https' -O "${base}/${tarball}" -O "${base}/checksums.txt"
        sha256sum -c --ignore-missing checksums.txt
        tar -xzf "$tarball" betterleaks
        sudo install -m 0755 betterleaks /usr/local/bin/betterleaks
        betterleaks version
